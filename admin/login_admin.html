<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - BRIN Visualization</title>

    <!-- Google Fonts & Bootstrap Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        :root {
            --primary-color: #0B4F6C;
            --primary-hover: #083c52;
            --bg-gradient: linear-gradient(135deg, #f5f7fb 0%, #e4ecf5 100%);
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-radius: 12px;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .login-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            transition: transform 0.3s ease;
        }

        .login-header {
            background: var(--primary-color);
            padding: 35px 30px;
            text-align: center;
            color: white;
            position: relative;
        }

        .login-header h2 {
            font-size: 22px;
            font-weight: 700;
            margin: 0;
            letter-spacing: 0.5px;
        }

        .login-header p {
            font-size: 13px;
            opacity: 0.8;
            margin: 8px 0 0;
        }

        .login-body {
            padding: 40px 30px;
        }

        .form-label {
            font-weight: 500;
            font-size: 14px;
            color: #555555;
            margin-bottom: 8px;
        }

        .input-group-custom {
            position: relative;
            display: flex;
            align-items: center;
        }

        .form-control-custom {
            width: 100%;
            padding: 12px 16px;
            padding-right: 45px;
            border-radius: 8px;
            border: 1.5px solid #dcdcdc;
            font-size: 15px;
            outline: none;
            transition: all 0.2s ease-in-out;
        }

        .form-control-custom:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(11, 79, 108, 0.15);
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            background: none;
            border: none;
            color: #777777;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: color 0.2s ease;
        }

        .password-toggle:hover {
            color: var(--primary-color);
        }

        .btn-login {
            background-color: var(--primary-color);
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(11, 79, 108, 0.2);
        }

        .btn-login:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(11, 79, 108, 0.3);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-back {
            background-color: transparent;
            color: #666666;
            border: 1.5px solid #dcdcdc;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-back:hover {
            background-color: #f1f3f5;
            color: #333333;
            border-color: #cccccc;
        }

        .alert-custom {
            background-color: #fdf2f2;
            border: 1px solid #f8b4b4;
            color: #9b1c1c;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 24px;
            display: none;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="login-header">
            <h2>ADMIN DASHBOARD BRIN</h2>
            <p>PR Sains Data dan Informasi</p>
        </div>

        <div class="login-body">
            <!-- Alert Banner -->
            <div id="errorAlert" class="alert-custom">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span id="errorMessage">Username atau Password salah.</span>
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="mb-4">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-group-custom">
                        <input type="text" id="username" class="form-control-custom" placeholder="Masukkan username" required autocomplete="username">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-group-custom">
                        <input type="password" id="password" class="form-control-custom" placeholder="Masukkan password" required autocomplete="current-password">
                        <button type="button" class="password-toggle" id="passwordToggle" onclick="togglePasswordVisibility()">
                            <i class="bi bi-eye" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login mb-3">
                    Masuk <i class="bi bi-box-arrow-in-right ms-1"></i>
                </button>

                <a href="/" class="btn-back">
                    <i class="bi bi-arrow-left"></i> Kembali ke Dashboard
                </a>
            </form>
        </div>
    </div>

    <script>
        // Cek jika sudah login, redirect langsung ke admin
        if (localStorage.getItem('admin_logged_in') === 'true') {
            window.location.href = '/admin';
        }

        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('bi-eye');
                toggleIcon.classList.add('bi-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('bi-eye-slash');
                toggleIcon.classList.add('bi-eye');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value;
            const errorAlert = document.getElementById('errorAlert');

            if (usernameInput === 'admin' && passwordInput === 'brin123') {
                localStorage.setItem('admin_logged_in', 'true');
                window.location.href = '/admin';
            } else {
                errorAlert.style.display = 'flex';
                // Reset password input
                document.getElementById('password').value = '';
            }
        }
    </script>
</body>

</html>
