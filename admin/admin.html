<!DOCTYPE html>
<html lang="id">

<head>

    <!-- Auth Guard: Blokir akses langsung tanpa login -->
    <script>
        if (localStorage.getItem('admin_logged_in') !== 'true') {
            window.location.replace('/login_admin');
        }
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard BRIN</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background: #f5f7fb;
        }

        .card {
            border: none;
            border-radius: 15px;
        }

        .card-header {
            background: #0B4F6C;
            color: white;
        }

        .table th {
            background: #0B4F6C;
            color: white;
        }
    </style>

</head>

<body>

    <div class="container mt-4">

        <div class="card shadow">

            <div class="card-header">

                <h2>
                    <i class="bi bi-speedometer2"></i>
                    ADMIN DASHBOARD BRIN
                </h2>

                <p class="mb-0">
                    PR Sains Data dan Informasi
                </p>

            </div>

            <div class="card-body">

                <div class="row mb-4">

                    <div class="col-md-4">

                        <div class="card shadow-sm">

                            <div class="card-body text-center">

                                <h5>Total Periset</h5>

                                <h2 id="totalPeriset">0</h2>

                            </div>

                        </div>

                    </div>

                    <div class="col-md-4">

                        <div class="card shadow-sm">

                            <div class="card-body text-center">

                                <h5>Total Kegiatan</h5>

                                <h2 id="totalKegiatan">0</h2>

                            </div>

                        </div>

                    </div>

                    <div class="col-md-4">

                        <div class="card shadow-sm">

                            <div class="card-body text-center">

                                <h5>Kelompok Riset</h5>

                                <h2 id="totalKelompok">0</h2>

                            </div>

                        </div>

                    </div>

                </div>



                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="d-flex gap-2">
                        <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalTambah">
                            <i class="bi bi-plus-circle"></i> Tambah Data
                        </button>
                        <a href="/?refresh=1" target="_blank" class="btn btn-outline-primary" title="Re-generate dashboard dari data Supabase terbaru">
                            <i class="bi bi-arrow-clockwise"></i> Refresh Dashboard
                        </a>
                    </div>
                    <div class="input-group" style="width: 300px;">
                        <span class="input-group-text"><i class="bi bi-search"></i></span>
                        <input type="text" id="searchInput" class="form-control" placeholder="Cari periset / kegiatan...">
                    </div>
                </div>

                <table class="table table-bordered table-hover align-middle">

                    <thead>

                        <tr>
                            <th>No</th>
                            <th>Kelompok</th>
                            <th>Kegiatan</th>
                            <th>Periset</th>
                            <th>Peran</th>
                            <th>Status</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>

                    <tbody id="isiTabel">

                    </tbody>

                </table>
                <div class="d-flex justify-content-between align-items-center mt-3">
                    <span id="pageInfo" class="text-muted">Menampilkan 0 dari 0 data</span>
                    <nav>
                        <ul class="pagination mb-0" id="paginationControls">
                            <!-- Pagination akan diisi JS -->
                        </ul>
                    </nav>
                </div>
            </div>

        </div>

    </div>



    <div class="modal fade" id="modalTambah">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <div class="modal-header">

                    <h5>Tambah Data</h5>

                    <button class="btn-close" data-bs-dismiss="modal"></button>

                </div>

                <div class="modal-body">

                    <form id="formData">

                        <div class="mb-3">

                            <label>Kelompok Riset</label>

                            <input type="text" class="form-control" id="kelompok">

                        </div>

                        <div class="mb-3">

                            <label>Kegiatan Riset</label>

                            <input type="text" class="form-control" id="kegiatan">

                        </div>

                        <div class="mb-3">

                            <label>Periset</label>

                            <input type="text" class="form-control" id="periset">

                        </div>

                        <div class="mb-3">

                            <label>Peran</label>

                            <select class="form-select" id="peran">

                                <option>Ketua</option>

                                <option>Anggota</option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label>Status</label>

                            <select class="form-select" id="status">

                                <option>Internal PRSDI</option>

                                <option>Eksternal PRSDI</option>

                                <option>Eksternal BRIN</option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label>Foto</label>

                            <input type="file" class="form-control" id="foto">

                        </div>

                    </form>

                </div>

                <div class="modal-footer">

                    <button class="btn btn-secondary" data-bs-dismiss="modal">

                        Batal

                    </button>

                    <button class="btn btn-primary" id="btnSimpan">

                        Simpan

                    </button>

                </div>

            </div>

        </div>

    </div>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="admin.js"></script>

</body>

</html>
